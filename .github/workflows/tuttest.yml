name: tuttest

on:
  pull_request:
    paths:
      - 'ci/**'
      - 'misc/yamlcore/**'
      - '.github/workflows/tuttest.yml'
      - 'docs/DEVELOPMENT.md'
  push:
    branches: ['**']
    paths:
      - 'ci/**'
      - 'misc/yamlcore/**'
      - '.github/workflows/tuttest.yml'
      - 'docs/DEVELOPMENT.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_NAME: tuttest-script
  SCRIPT: tuttest-script.sh

jobs:
  grab-readme-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Install tuttest
        run: |
          python3 -m pip install setuptools
          python3 -m pip install git+https://github.com/antmicro/tuttest@5dbe5845c9ef46f1c0315129449743db010ff966
          # On GitHub Actions, pip installs "binaries" to this directory
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Test tuttest
        run: tuttest --help

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Grab install-prerequisites commands with tuttest
        run: |
          # Override the repository URL for forks, keeping the tutorial's directory name.
          printf 'export REPO_URL=%q\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" > "$SCRIPT"
          tuttest docs/DEVELOPMENT.md install-prerequisites >> "$SCRIPT"
          printf '\n' >> "$SCRIPT"

      - name: Add checkout commands
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            printf 'git fetch origin %q\n' "$GITHUB_REF" >> "$SCRIPT"
          fi
          printf 'git checkout --detach %q\n\n' "$GITHUB_SHA" >> "$SCRIPT"

      - name: Grab prepare-and-build commands with tuttest
        run: |
          tuttest docs/DEVELOPMENT.md prepare-and-build >> "$SCRIPT"

      - name: Print ${{ env.SCRIPT }}
        run: cat "$SCRIPT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.SCRIPT }}

  test-readme-commands:
    needs: grab-readme-commands
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container-os:
          - 'ubuntu:22.04'
          - 'ubuntu:24.04'
          - 'ubuntu:26.04'
          - 'ubuntu:26.10'
          - 'debian:12'
          - 'debian:13'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
      - name: Test
        env:
          TEST_IMAGE: ${{ matrix.container-os }}
        # Run actions on the hosted runner; the test image only needs Bash.
        run: |
          docker run --rm -i -e CI=true -e DEBIAN_FRONTEND=noninteractive \
            "$TEST_IMAGE" bash -ex -o pipefail -s < "$SCRIPT"
