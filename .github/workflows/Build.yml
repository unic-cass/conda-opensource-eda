name: Build openEMS (hosted check)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANACONDA_TOKEN:
        description: 'Anaconda Token'
      ANACONDA_USER:
        description: 'Anaconda User'
permissions:
  contents: read

env:
  UPLOAD: no-upload
  DEBIAN_FRONTEND: noninteractive
  # GHA_MACHINE_TYPE: "n2-standard-4"
  APT_REQUIREMENTS: binutils build-essential csh curl git libgl1 pkg-config sudo wget libc6-dev

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check workflow and recipe layout
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 ci/validate.py
          bash ci/lint-workflows.sh

  openems-linux-py313:
    runs-on: ubuntu-22.04
    needs: validate
    env:
      PACKAGE: sim/openems
      OS_NAME: linux
      PYTHON_VERSION: '3.13'
    steps:
      - uses: actions/checkout@v6
      - run: bash ci/apt-install.sh $APT_REQUIREMENTS
      - uses: ./ci

  openems-linux-py314:
    runs-on: ubuntu-22.04
    needs: validate
    env:
      PACKAGE: sim/openems
      OS_NAME: linux
      PYTHON_VERSION: '3.14'
    steps:
      - uses: actions/checkout@v6
      - run: bash ci/apt-install.sh $APT_REQUIREMENTS
      - uses: ./ci

  openems-linux-py315:
    runs-on: ubuntu-22.04
    needs: validate
    env:
      PACKAGE: sim/openems
      OS_NAME: linux
      PYTHON_VERSION: '3.15'
      CI_INSTALL_PYTHONS: '3.15.2'
    steps:
      - uses: actions/checkout@v6
      - run: bash ci/apt-install.sh $APT_REQUIREMENTS
      - uses: ./ci
