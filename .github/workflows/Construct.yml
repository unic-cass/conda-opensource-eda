  mixed-signal-tools-installer:
    runs-on: 'ubuntu-22.04'
    strategy:
      fail-fast: false
      matrix:
        include_librelane: ${{ fromJSON(startsWith(github.ref, 'refs/tags/tools-') && '[false,true]' || (inputs.include_librelane && '[true]' || '[false]')) }}
    env:
      INCLUDE_LIBRELANE: ${{ matrix.include_librelane && '1' || '0' }}
      INSTALLER: ${{ matrix.include_librelane && 'mixed-signal-librelane-3.0.17-Linux-x86_64.sh' || 'mixed-signal-tools-0-Linux-x86_64.sh' }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: installer-env
          miniconda-version: latest
          python-version: '3.12'

      - name: Build mixed-signal installer
        env:
          CONDA_CHANNEL_PRIORITY: flexible
          CONDA_REMOTE_MAX_RETRIES: '5'
        run: |
          conda install --yes --override-channels -c defaults constructor=3.17.3
          constructor installer/mixed-signal.tools

      - name: Smoke-test installed tools
        run: |
          bash installer/mixed-signal.tools/smoke-test.sh "$INSTALLER"
          sha256sum "$INSTALLER" > "$INSTALLER.sha256"

      - name: archive installer
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.include_librelane && 'mixed-signal-librelane-installer' || 'mixed-signal-tools-installer' }}
          path: |
            ${{ env.INSTALLER }}
            ${{ env.INSTALLER }}.sha256
          if-no-files-found: error

  release-tools:
    if: ${{ startsWith(github.ref, 'refs/tags/tools-') && github.event_name == 'push' }}
    needs: mixed-signal-tools-installer
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !env.ACT }}
        with:
          pattern: mixed-signal-*-installer
          merge-multiple: true
      - name: Publish mixed-signal release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check mixed-signal-tools-0-Linux-x86_64.sh.sha256
          sha256sum --check mixed-signal-librelane-3.0.17-Linux-x86_64.sh.sha256
          { cat installer/mixed-signal.tools/release-notes.md; printf '\n'; cat installer/mixed-signal.tools/release-notes-librelane.md; } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Mixed-signal EDA tools (${GITHUB_REF_NAME#tools-})" \
            --notes-file release-notes.md \
            mixed-signal-tools-0-Linux-x86_64.sh{,.sha256} \
            mixed-signal-librelane-3.0.17-Linux-x86_64.sh{,.sha256}

  release:
    if: ${{ !startsWith(github.ref, 'refs/tags/tools-') && !inputs.include_librelane }}
    needs:
      - mixed-signal-tools-installer
  #     - analog-sky130a-installer
      - mixed-signal-sky130a-installer
  #     - digital-gf180mcuc-installer
  #     - analog-gf180mcuc-installer
      - mixed-signal-gf180mcuc-installer
  #     - mixed-signal-installer
    runs-on: 'ubuntu-22.04'
    permissions:
      contents: write
    steps:
      - name: checkout conda-eda
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4

      - name: dump checksums
        run: |
          md5sum mixed-signal-tools-installer/*.sh
          md5sum mixed-signal.gf180mcuc-installer/*.sh
          md5sum mixed-signal.sky130a-installer/*.sh

      - run: |
          git config --local user.name conda-eda@bot
          git config --local user.email conda-eda@bot
          TAG=$(git describe)
          git tag $TAG
          git push origin "HEAD:refs/tags/$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          body_path: installer/mixed-signal.tools/release-notes.md
          files: |
            mixed-signal-tools-installer/*.sh
            mixed-signal-tools-installer/*.sha256
            mixed-signal.gf180mcuc-installer/*.sh
            mixed-signal.sky130a-installer/*.sh
