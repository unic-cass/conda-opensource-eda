name: Build installers

on:
  push:
    branches:
    - '**'
    tags:
    - 'tools-*'
    paths:
    - 'installer/mixed-signal.sky130a/*'
    - 'installer/mixed-signal.gf180mcuc/*'
  workflow_dispatch:
    inputs:
      include_librelane:
        description: 'Build only the mixed-signal installer with LibreLane'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
