name: Publish openEMS defaults builds

on:
  push:
    branches: [maintenance/publish-openems-defaults]

permissions:
  contents: read

concurrency: unic-cass-openems-defaults-publish

jobs:
  publish:
    if: github.repository == 'unic-cass/conda-opensource-eda'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v3
        if: ${{ !env.ACT }}
        with:
          activate-environment: base
          miniconda-version: latest
      - name: Install Anaconda client
        if: ${{ !env.ACT }}
        shell: bash -el {0}
        run: conda install -y --override-channels -c defaults anaconda-client=1.16.0
      - name: Fetch the three validated build archives
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download openems-0.37.0-defaults --pattern 'openems-0.37.0-py*_defaults_1.conda' --dir maintenance/artifacts
      - name: Check archive hashes and channel capacity
        id: plan
        shell: bash -el {0}
        run: python3 -u maintenance/publish-openems-defaults.py plan
      - name: Publish via the standard CI scripts
        if: ${{ !env.ACT && steps.plan.outputs.pending != '' }}
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_USER: ${{ secrets.ANACONDA_USER }}
          OPENEMS_PENDING: ${{ steps.plan.outputs.pending }}
        run: bash maintenance/upload-via-ci.sh
      - name: Verify all three builds on main
        if: ${{ !env.ACT }}
        shell: bash -el {0}
        run: python3 -u maintenance/publish-openems-defaults.py verify
