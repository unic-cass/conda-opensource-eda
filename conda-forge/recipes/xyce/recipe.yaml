# Xyce: serial build bundling Trilinos 14.4.0.
#
# WHY BUNDLE TRILINOS (verified live on 2026-11-15 with build-locally.py):
# conda-forge's trilinos 16.2 package does not provide the components Xyce
# requires (Amesos, Epetra, EpetraExt, Ifpack, NOX, Teuchos, Sacado,
# Triutils, AztecOO, Belos, TrilinosCouplings were all reported
# "Could not find component" by TrilinosConfig.cmake). Xyce 7.10 still
# requires the classic (Epetra-era) Trilinos stack, and upstream documents
# Trilinos >= 14.4 (14.4 rigorously tested) - so we bundle 14.4.0 exactly as
# hdl/conda-eda does, using conda-forge BLAS/LAPACK/SuiteSparse instead of
# bundled netlib sources.
#
# This is a heavy build; conda-forge reviewers may prefer a separate
# `trilinos-14` feedstock - be ready to discuss in the PR.
context:
  version: "7.10.0"

package:
  name: xyce
  version: ${{ version }}

source:
  - url: https://github.com/Xyce/Xyce/archive/refs/tags/Release-${{ version }}.tar.gz
    sha256: b5a883196f0a2b3972fd13c541fecf04735bfabc7d124d7c7e17de707204f4e2
  - url: https://github.com/trilinos/Trilinos/archive/refs/tags/trilinos-release-14-4-0.tar.gz
    sha256: 8e7d881cf6677aa062f7bfea8baa1e52e8956aa575d6a4f90f2b6f032632d4c6
    target_directory: Trilinos
    patches:
      - trilinos-14.4.0.patch

build:
  number: 0
  skip:
    - win
    - osx
  script: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
    - bison
    - flex
    - pkgconf
  host:
    - suitesparse       # provides KLU/KLU2 + AMD used by Amesos2/KLU2
    # pin BLAS/LAPACK provider: the `blas`/`lapack` metapackages let the test
    # env resolve to a different provider than the build linked against
    - libopenblas
    - fftw
    - libgfortran5
  run: []

tests:
  - script:
      - Xyce -v

about:
  homepage: https://xyce.sandia.gov/
  repository: https://github.com/Xyce/Xyce
  # Xyce: GPL-3.0-or-later; bundled Trilinos: multi-licensed collection
  # (top-level LICENSE file covers per-package terms)
  license: GPL-3.0-or-later AND BSD-3-Clause
  license_file:
    - COPYING
    - Trilinos/LICENSE
  summary: The Xyce Parallel Electronic Simulator
  description: |
    Xyce (zīs, rhymes with "spice") is an open source, SPICE-compatible,
    high-performance analog circuit simulator, capable of solving extremely
    large circuit problems by supporting large-scale parallel computing
    platforms. It also supports serial execution on all common desktop
    platforms, and small-scale parallel runs on Unix-like systems.

extra:
  recipe-maintainers:
    - duyhieubui
