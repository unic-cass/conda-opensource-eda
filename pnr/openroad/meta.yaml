# Use `conda-build-prepare` before building for a better version string.
#{% set version = '%s_%04i_%s'|format(GIT_DESCRIBE_TAG, GIT_DESCRIBE_NUMBER | int(default=0), GIT_DESCRIBE_HASH or 'gUNKNOWN') %}

{% set version = '%s'|format(GIT_DESCRIBE_TAG | default('0.0')) %}

{% set python_version = PYTHON_VERSION | default('3.12') %}
{% set py_suffix = 'py%s'|format(python_version|replace('.', '')) %}
{% set lemon_version = '1.3.1' %}
{% set lemon_md5 = '1ff3c2d022168c82aa82a50d9d1ace73' %}
{% set cudd_version = '3.0.0' %}
{% set cudd_md5 = 'f81874f0fa8aac9905f0f4aed36ecd05' %}
{% set or_tools_version = '9.11' %}
{% set or_tools_md5 = '08cedd17bd148118439ff9f7d546ccaf' %}

package:
  name: openroad
  version: {{ version }}

source:
  - git_url: https://github.com/The-OpenROAD-Project/OpenROAD.git
    git_rev: dcf36133
    # patches:
    # 	- openroad-fmt-9.1.patch
  - url: https://github.com/The-OpenROAD-Project/lemon-graph/archive/refs/tags/{{ lemon_version }}.tar.gz
    md5: {{ lemon_md5 }}
    folder: third_party/lemon
  - url: https://github.com/The-OpenROAD-Project/cudd/archive/refs/tags/{{ cudd_version }}.tar.gz
    md5: {{ cudd_md5 }}
    folder: third_party/cudd
  - url:     https://github.com/google/or-tools/archive/refs/tags/v{{ or_tools_version }}.tar.gz
    md5: {{ or_tools_md5 }}
    folder: third_party/or-tools
build:
  # number: 202202031935
  number: {{ environ.get('DATE_NUM') }}
  # string: 20220203_1935_py37
  string: {{ environ.get('DATE_STR') }}_{{ py_suffix }}
  script_env:
    - CI
  ignore_run_exports_from:
    # header-only libraries
    - fmt

requirements:
  build:
    - make
    - rhash 1.4.3
    - cmake 3.31.2
    - swig 4.3.0
    - bison
    - flex
    - gtest 1.17.0
    # - sysroot_linux-64 >=2.28
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ cdt('libx11-devel') }}         # [linux]
    - {{ cdt('libxau-devel') }}         # [linux]
    - {{ cdt('libxext-devel') }}        # [linux]
    - {{ cdt('libxdamage-devel') }}     # [linux]
    - {{ cdt('libxfixes-devel') }}      # [linux]
    - {{ cdt('libxxf86vm-devel') }}     # [linux]
    - {{ cdt('xorg-x11-proto-devel') }} # [linux]
    - {{ cdt('mesa-libgl-devel') }}     # [linux]
    - {{ cdt('mesa-dri-drivers') }}     # [linux]
    - {{ cdt('libselinux-devel') }}     # [linux]

  host:
    - yaml-cpp
    - python {{ python_version }}
{% if python_version == '3.15' %}
    - libpython {{ python_version }}
{% endif %}
{% if python_version in ('3.13', '3.14', '3.15') %}
    # These Python builds need newer zlib than Boost 1.82 and the Qt metapackage.
    - libboost 1.88.*
    - libboost-devel 1.88.*
{% else %}
    - libboost 1.82
{% endif %}
    - eigen 3.4.0
    - spdlog 1.15.3
{% if python_version in ('3.13', '3.14', '3.15') %}
    - tk 8.6.*
{% else %}
    - tk
{% endif %}
    - zlib
    - fmt
    - libgomp                 [not osx]
    - llvm-openmp             [osx]
{% if python_version in ('3.13', '3.14', '3.15') %}
    # Qt Core, Widgets, and Charts are already provided by qt-main.
    - qt-main 5.15.2.*
{% else %}
    - qt >=5.7,<6
{% endif %}
    - libxcb
    - xcb-util-image
    - xcb-util-keysyms
    - xcb-util-renderutil
    - xcb-util-wm
  run:
    # missing run_exports
    - {{ pin_compatible('libboost', min_pin='x.x', max_pin='x.x') }}
    - {{ pin_compatible('python', min_pin='x.x', max_pin='x.x') }}
{% if python_version == '3.15' %}
    - libpython {{ python_version }}
{% endif %}
    - qt-main >=5.7,<6
    - spdlog 1.15.3
    - yaml-cpp

test:
  commands:
    - openroad -version
    - sta -version
{% if python_version in ('3.13', '3.14', '3.15') %}
    - |
      printf '%s\n' 'import sys, odb' \
        'assert f"{sys.version_info.major}.{sys.version_info.minor}" == "{{ python_version }}"' \
        'assert odb.dbDatabase.create() is not None' \
        'print("OpenROAD Python bindings OK")' > check_openroad.py
      openroad -python -exit check_openroad.py | grep -F 'OpenROAD Python bindings OK'
{% endif %}

about:
  home: https://theopenroadproject.org/
  license: BSD-3-Clause
  summary: OpenROAD is an unified application implementing an RTL-to-GDS Flow.

extra:
  recipe-maintainers:
    - duyhieu.bui
