# Use `conda-build-prepare` before building for a better version string.
{% set version = '%s_%04i_%s'|format(GIT_DESCRIBE_TAG|replace('yosys-', '') or '0.X', GIT_DESCRIBE_NUMBER|int, GIT_DESCRIBE_HASH or 'gUNKNOWN') %}

{% set python_version = PYTHON_VERSION | default('3.12') %}
{% set py_suffix = 'py%s'|format(python_version|replace('.', '')) %}

package:
  name: yosys
  version: {{ version }}

source:
  - git_url: https://github.com/YosysHQ/yosys.git
    git_rev: 7326bb7
    patches:
      - fix-linux-perf-unistd.patch
    #   - fix-bison-version-yosys-0.56.patch
  - git_url: https://github.com/povik/yosys-slang
    # Supports Yosys 0.62 and still provides the compatibility Makefile.
    git_rev: 3251530961e0e8a8054098c9bb8376474958944a
    folder: plugins/slang
    # patches:
    #   - fix-gcc-11.2-std-hash-slang-plugin.patch

build:
  # number: 201803050325
  number: {{ environ.get('DATE_NUM') }}
  # string: 20180305_0325_py37
  string: {{ environ.get('DATE_STR') }}_{{ py_suffix }}
  script_env:
    - CI
    - LD_LIBRARY_PATH
    - CONDA_OUT
    - TEST_PACKAGE

test:
  files:                                                   # [osx]
    - test.sh                                              # [osx]
    - only-test.patch                                      # [osx]
  source_files:
    - tests/simple/always01.v
  commands:
    - yosys -V
    - yosys-abc -v 2>&1 | grep compiled
    - yosys -Q -p synth tests/simple/always01.v
    - yosys -Q -m slang -p 'read_slang tests/simple/always01.v; synth'  # [linux or osx]
    - git clone https://github.com/timvideos/yosys.git     # [osx]
    - cd yosys                                             # [osx]
    - git apply ../only-test.patch                         # [osx]
    - cd ..                                                # [osx]
    - bash test.sh                                         # [osx]

requirements:
  build:
    - m2w64-toolchain 5.3.0     [win]
    - m2-make                   [win]
    - m2-base 1.0.0             [win]
    - m2-bash 4.3               [win]
    - m2-bison 3.0.4            [win]
    - m2-flex  2.6.0            [win]
    - make                      [not win]
    - {{ compiler('c') }}       [not osx]
    - {{ compiler('cxx') }}     [not osx]
    - {{ compiler('c') }} 4.0   [osx]
    - {{ compiler('cxx') }} 4.0 [osx]
    - cmake >=3.22.1
    - scikit-build
    - scikit-build-core
    - python {{ python_version }}
{% if python_version == '3.15' %}
    - libpython {{ python_version }}
{% endif %}
{% if python_version in ('3.13', '3.14', '3.15') %}
    - tk 8.6.*
{% endif %}

  host:
    - python {{ python_version }}
    - m2-base 1.0.0        [win]
    - m2-bison 3.0.4       [win]
    - m2-flex 2.6.0        [win]
    - m2-libreadline 6.3   [win]
    - m2-zlib              [win]
    - bison                [not win]
    - flex                 [not win]
{% if python_version in ('3.13', '3.14', '3.15') %}
    # Match the libffi ABI used by current Conda-forge Python and KLayout's Ruby.
    - libffi 3.7.*         [not win]
{% else %}
    - libffi               [not win]
{% endif %}
    - pkg-config           [not win]
{% if python_version == '3.15' %}
    - libpython {{ python_version }}
{% endif %}
{% if python_version in ('3.13', '3.14', '3.15') %}
    # Match the Tcl/Tk 8.6 ABI used by the rest of the LibreLane stack.
    - tk 8.6.*             [not win]
{% else %}
    - tk                   [not win]
{% endif %}
    - zlib                 [not win]
    - gawk [osx]
  run:
    - gawk     [osx]
    - iverilog [osx]
    - libffi
    - tk
    - python {{ python_version }}
{% if python_version == '3.15' %}
    - libpython {{ python_version }}
{% endif %}

about:
  home: http://www.clifford.at/yosys/
  license: ISC
  license_file: COPYING
  summary: 'Yosys is a framework for Verilog RTL synthesis. It currently has extensive Verilog-2005 support and provides a basic set of synthesis algorithms for various application domains.'
