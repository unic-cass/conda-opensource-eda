# SymbiYosys 0.62 — pinned to the YosysHQ tag v0.62, matching the yosys 0.62
# built by this repository (librelane 3.0.17's documented tool set).
{% set python_version = PYTHON_VERSION | default('3.12') %}
{% set py_suffix = 'py%s'|format(python_version|replace('.', '')) %}

package:
  name: symbiyosys
  version: "0.62.0"

source:
  - git_url: https://github.com/YosysHQ/SymbiYosys.git
    # v0.62 commit; conda-build-prepare renames the tag in its local clone.
    git_rev: 16171682e419dac18037398a05b40c651aac3519
    folder: SymbiYosys
  - git_url: https://github.com/Boolector/boolector.git
    folder: boolector
    patches:
      - fixup_lingeling.patch
  - git_url: https://github.com/Z3Prover/z3.git
    folder: z3

build:
  detect_binary_files_with_prefix: True
  number: {{ environ.get('DATE_NUM') }}
  string: {{ environ.get('DATE_STR') }}_{{ py_suffix }}
  script_env:
    - CI

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - curl
    - gperf
    - gmp
    - make
  host:
    # Yosys's build string needs to end with `py_suffix`
    - yosys * *_{{ py_suffix }}
  run:
    - yosys * *_{{ py_suffix }}
    # sby's CLI uses click at runtime
    - click

test:
  files:
    - test/demo3.sby

about:
  home: http://symbiyosys.readthedocs.io
  license: ISC
  summary: 'SymbiYosys (sby) is a front-end driver program for Yosys-based formal hardware verification flows.'
