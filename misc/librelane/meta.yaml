# librelane 3.0.17 — the Python EDA flow infrastructure (OpenLane 2 successor).
#
# Pure-Python (noarch) package installed from the pinned PyPI sdist.
#
# Tool binaries (openroad, yosys, magic, netgen, klayout) come from this
# repository and are pinned to the exact versions librelane 3.0.17 documents
# in its release `tool_versions.txt`, except for the newer Magic patch release:
#   openroad @ dcf36133a369abc8f3c5e5738cd4d82e4903c0e0
#   yosys @ v0.62 (7326bb7d6)
#   klayout @ 0.30.7 (6dd3e6b10)
#   magic-vlsi @ 8.3.698 (upstream pin: 8.3.623)
#   netgen @ 1.5.316
{% set test_python = PYTHON_VERSION | default('3.12') %}

package:
  name: librelane
  version: "3.0.17"

source:
  url: https://files.pythonhosted.org/packages/41/1f/1bdec943465f9c6e25fca18e599a746118661783df8879c4159907f8d833/librelane-3.0.17.tar.gz
  sha256: e6b915b0fe09b1c22abb74437a51164d5486939f942000742e90f4440e9b0aaa

build:
  noarch: python
  # number: 201803050325
  number: {{ environ.get('DATE_NUM') }}
  # string: 20180305_0325
  string: {{ environ.get('DATE_STR') }}
  script: $PYTHON -m pip install . --no-build-isolation --no-deps --ignore-installed -vv
  script_env:
    - CI
    - CONDA_OUT
    - TEST_PACKAGE

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
    - poetry-core >=2.0.0,<3
  run:
    - python >=3.10
    # --- librelane's declared Python dependencies (pip names -> conda names)
    - click >=8,<8.3
    - cloup >=3.0.5,<4
    - pyyaml >=5,<7
    - rich >=12,<16
    - lxml >=4.9.0
    - deprecated >=1.2.10,<2
    - psutil >=5.9.0
    - httpx >=0.22.0,<0.29
    - rapidfuzz >=3.9.0,<4
    - semver >=3.0.2,<4
    # klayout: the Python module - provided by this repository's `klayout`
    # package (the KLayout app build includes the Python bindings), which
    # also ships the KLayout binary librelane invokes.
    - klayout 0.30.7_0_g6dd3e6b10
    # yamlcore: packaged here (conda-forge has no yamlcore); librelane pins
    # >=0.0.2,<0.1.0
    - yamlcore >=0.0.2,<0.1.0
    # lln-libparse (pip name) is packaged here under its original name
    # `libparse`; it is librelane's Verilog liberty parser C++ extension.
    - libparse 0.56.*
    # ciel: the PDK manager (pip name ciel)
    - ciel >=2.3.1,<3
    # --- tool binaries (from this repository, at librelane 3.0.17's pins)
    - openroad 2.0_28825_gdcf36133a3
    - yosys 0.62_0_g7326bb7d6
    - magic 8.3.698_0_g8d37ad4c
    - netgen 1.5.316_0_gb76c9a1
    # Classic starts with Verilator lint.
    - verilator
    # symbiyosys (sby) + eqy are required by librelane's equivalence steps
    - symbiyosys
    - eqy

test:
  requires:
    - python {{ test_python }}
  commands:
    - librelane --version
    - librelane.env_info
    - python -c "import librelane; import klayout.db"
    - openroad -version
    - sta -version
    - klayout -v
    - yosys -V
    - verilator --version
    - magic -dnull -noconsole --version
    - netgen -batch quit

about:
  home: https://librelane.org/
  license: Apache-2.0
  license_file: LICENSE
  summary: 'An infrastructure for implementing chip design flows'
  description: |
    LibreLane is a libre infrastructure for implementing chip design flows,
    the successor of OpenLane 2. It drives a set of underlying tools
    (OpenROAD, Yosys, KLayout, Magic, Netgen, ...) to take a design from
    RTL to GDSII.
  doc_url: https://librelane.readthedocs.io
  dev_url: https://github.com/librelane/librelane

extra:
  recipe-maintainers:
    - duyhieubui
