# ciel — the PDK manager (pip name `ciel`; used by librelane to fetch
# sky130/gf180mcu PDKs). Pure Python, noarch.
#
# conda-forge has no ciel package, so it is packaged here.
# The sdist ships no license file; it is fetched from the upstream tag.
package:
  name: ciel
  # LibreLane 3.0.17 requires ciel >=2.3.1,<3.
  version: "2.6.1"

source:
  - url: https://files.pythonhosted.org/packages/59/24/98ac927526ce8e42e825e7ec33502b6f80bec16243e8d6da3647aa2e36a4/ciel-2.6.1.tar.gz
    sha256: e4fcfb303f5c603752b51541c4cf47baf6b08f300f5df65d36372234451896ec
  # The sdist ships no license file; LICENSE (from upstream tag 2.6.1) is
  # vendored in this recipe directory.

build:
  noarch: python
  number: {{ environ.get('DATE_NUM') }}
  string: {{ environ.get('DATE_STR') }}
  script: $PYTHON -m pip install . --no-build-isolation --no-deps --ignore-installed -vv
  script_env:
    - CI
    - CONDA_OUT
    - TEST_PACKAGE

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
    - poetry-core >=1.0.0
  run:
    - python >=3.8
    - click >=8,<8.5
    - httpx >=0.22.0,<0.29
    - pcpp >=1.2,<2
    - pyyaml >=5,<7
    - rich >=12,<16
    - zstandard >=0.19.0,<1

test:
  commands:
    - ciel --help

about:
  home: https://github.com/fossi-foundation/ciel
  license: Apache-2.0
  license_file: LICENSE
  summary: 'A fork of open_pdks, using build system infrastructure from librelane'
  description: |
    Ciel is a wrapper for building and installing open-source PDKs
    (sky130, gf180mcu, ...) — a fork of open_pdks using build infrastructure
    from LibreLane.
  dev_url: https://github.com/fossi-foundation/ciel

extra:
  recipe-maintainers:
    - duyhieubui
