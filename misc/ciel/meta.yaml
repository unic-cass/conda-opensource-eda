# ciel — the PDK manager (pip name `ciel`; used by librelane to fetch
# sky130/gf180mcu PDKs). Pure Python, noarch.
#
# conda-forge has no ciel package, so it is packaged here.
# The sdist ships no license file; it is fetched from the upstream tag.
package:
  name: ciel
  version: "3.2.0"

source:
  - url: https://files.pythonhosted.org/packages/26/72/2dbea0d3ca2a5abee310ba9be07747c7d8172919838a8a8a91eb065aab6d/ciel-3.2.0.tar.gz
    sha256: 96d8faa5330f4f8a23ca10c76470ecf6f8a46b5dd85bbcbc25698872d919e1e8
  # The sdist ships no license file; LICENSE (from upstream tag 3.2.0) is
  # vendored in this recipe directory.

build:
  noarch: python
  number: {{ environ.get('DATE_NUM') }}
  string: {{ environ.get('DATE_STR') }}
  script: $PYTHON -m pip install . --no-deps --ignore-installed -vv
  script_env:
    - CI
    - CONDA_OUT
    - TEST_PACKAGE

requirements:
  host:
    - python
    - pip
    - setuptools
    - poetry-core
  run:
    - python
    - click >=8,<8.5
    - httpx >=0.22.0,<0.29
    - pcpp >=1.2,<2
    - pyyaml >=5,<7
    - rich >=12,<16
    - zstandard >=0.19.0,<1

test:
  commands:
    - ciel --help

about:
  home: https://github.com/fossi-foundation/ciel
  license: Apache-2.0
  license_file: LICENSE
  summary: 'A fork of open_pdks, using build system infrastructure from librelane'
  description: |
    Ciel is a wrapper for building and installing open-source PDKs
    (sky130, gf180mcu, ...) — a fork of open_pdks using build infrastructure
    from LibreLane.
  dev_url: https://github.com/fossi-foundation/ciel

extra:
  recipe-maintainers:
    - duyhieubui
