{% set version = "24.4.1" %}

package:
  name: qucs-s
  version: {{ version }}

source:
  # The release tarball includes Qucsator RF at the release's submodule revision.
  url: https://github.com/ra3xdh/qucs_s/releases/download/{{ version }}/qucs-s-{{ version }}.tar.gz
  sha256: 214bcc151cd8bc06c8365420d1a2ef0a6d46b154acfd8b4b51ecf5d9f112eda9

build:
  skip: true  # [not linux]
  number: {{ environ.get('DATE_NUM') }}
  string: {{ environ.get('DATE_STR') }}_qt5

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake 3.31.*
    - make
    - bison
    - flex
    - gperf
    - dos2unix
  host:
    # Match the Qt 5 build used by the mixed-signal installer.
    - qt-main 5.15.15.*
    - libgl-devel
  run:
    - qt-main 5.15.15.*

test:
  commands:
    - QT_QPA_PLATFORM=offscreen qucs-s --version | grep -F '{{ version }}'
    - ldd "$PREFIX/bin/qucs-s" | grep -F 'libQt5Core.so.5'
    - ldd "$PREFIX/bin/qucs-sspar-viewer" | grep -F 'libQt5Charts.so.5'

about:
  home: https://ra3xdh.github.io/
  dev_url: https://github.com/ra3xdh/qucs_s
  license: GPL-2.0-or-later
  license_file:
    - COPYING
    - qucsator_rf/COPYING
  summary: 'Qucs-S circuit simulator GUI, built with Qt 5'

extra:
  recipe-maintainers:
    - duyhieubui
