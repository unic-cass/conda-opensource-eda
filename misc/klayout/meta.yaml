# Use `conda-build-prepare` before building for a better version string.
{% set version = '%s_%04i_%s'|format(GIT_DESCRIBE_TAG, GIT_DESCRIBE_NUMBER|int, GIT_DESCRIBE_HASH or 'gUNKNOWN') %}

{% set python_version = PYTHON_VERSION | default('3.12') %}
{% set py_suffix = 'py%s'|format(python_version|replace('.', '')) %}

package:
  name: klayout
  version: {{ version }}

source:
  git_url: https://github.com/KLayout/klayout.git
  git_rev: 6dd3e6b
  patches:
    - force-python-dynamic-link.patch
    - python-3.15-weakrefs.patch
    # librelane 3.0.17 parity (nix-eda patch): bbox-conversion cache perf fix
    # in dbHierNetworkProcessor (DRC engine)
    - performance_regression.patch

build:
  # number: 201803050325
  number: {{ environ.get('DATE_NUM') }}
  # string: 20180305_0325_py37
  string: {{ environ.get('DATE_STR') }}_{{ py_suffix }}
  script_env:
    - CI
    - CONDA_OUT
    - TEST_PACKAGE

requirements:
  build:
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ cdt('mesa-libgl-devel') }}   [linux]
    - {{ cdt('mesa-dri-drivers') }}   [linux]
    - {{ cdt('libselinux') }}         [linux]
    - {{ cdt('libxdamage') }}         [linux]
    - {{ cdt('libxxf86vm') }}         [linux]
    - {{ cdt('libxext') }}            [linux]
    - {{ cdt('libxfixes') }}          [linux]
    - {{ cdt('libxau') }}             [linux]
    - {{ cdt('libxcb') }}             [linux]
    - {{ cdt('expat') }}              [linux]
    - {{ cdt('libpng') }}             [linux]
  host:
    - python {{ python_version }}
{% if python_version == '3.15' %}
    - libpython {{ python_version }}
{% endif %}
{% if python_version in ('3.13', '3.14', '3.15') %}
    - tk 8.6.*
    # KLayout needs Qt libraries, not the WebEngine pulled in by `qt`.
    - qt-main 5.15.2.*
{% else %}
    - qt >=5.0,<6.0
{% endif %}
    - ruby
    - zlib
    - libgit2
  run:
    - {{ pin_compatible('python', min_pin='x.x', max_pin='x.x') }}
{% if python_version == '3.15' %}
    - libpython {{ python_version }}
{% endif %}
    - libxcb
    - xcb-util
    - xcb-util-image
    - xcb-util-keysyms
    - xcb-util-renderutil
    - xcb-util-wm
    - ruby
    - zlib
    - psutil

test:
  commands:
    - klayout -v
    - python -c "from klayout.db import Layout; layout = Layout(); assert layout.create_cell('TOP').name == 'TOP'"
  requires:
    - ruby
    - python

about:
  home: https://www.klayout.de/
  summary: 'Your Mask Layout Friend'
  description: |
    - View: Fast and accurate viewing of huge layout files
    - Edit: Draw, modify and transform hierarchical layout
    - Generate: Script layout generators, PCells and layout transformation tools
    - Analyze: Search, verify, and measure layout and code analysis scripts
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE
  doc_url: https://www.klayout.de/doc.html
  dev_url: https://github.com/KLayout/klayout

extra:
  recipe-maintainers:
    - curtisma
    - klayoutmatthias
    - proppy
    - flaport
    - joamatab
